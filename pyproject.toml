[project]
name = "werkhaus"
version = "0.1.0"
description = "Werkhaus — an org of AI agents that runs as a company and builds your business."
requires-python = ">=3.13"
dependencies = [
    # The agent harness. Pinned from PyPI, NOT from ./software-agent-sdk (see AGENTS.md §A).
    # The SDK ships ~6 commits/day; a path dep would make every upgrade a merge.
    "openhands-sdk==1.41.0",
    "openhands-tools==1.41.0",
    # API surface
    "fastapi>=0.115",
    "uvicorn[standard]>=0.31.1",
    "websockets>=12",
    "pydantic>=2.12.5",
    # Brain / stub
    "pyyaml>=6.0",
    "filelock>=3.20.1",
    # Reading the web without a browser. All three arrive transitively via the
    # SDK today; declared because werkhaus/engines/openhands/web.py imports them
    # directly, and a transitive dep is not a promise.
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.scripts]
werkhaus = "werkhaus.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
    "ruff>=0.12.10",
]

[tool.uv]
# Mirror the SDK's own constraint. Without this our lock can pull a litellm the
# SDK has never been tested against, and litellm breaks provider behaviour often.
constraint-dependencies = ["litellm==1.93.0"]

[tool.pytest.ini_options]
addopts = "-v --tb=short"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = ["software-agent-sdk", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["werkhaus"]
