objections:
  - severity: serious
    about: artifacts/positioning.md
    text: >-
      The £29 price is defended entirely with competitor pricing. Not one person
      in the target audience has been asked what they'd pay. "Defensible against
      the market" has been quietly upgraded to "validated" between Maya's note and
      the positioning.
    settled_by: >-
      Five conversations with people who match the ICP, asking what they currently
      spend on objects like this.
  - severity: serious
    about: artifacts/unit-economics.md
    text: >-
      Contribution of £9.85 rests on three cost lines that are guesses, and
      breakage — the most likely killer for a business that mails ceramics — isn't
      in the model at all.
    settled_by: One real quote from a potter and one from a courier.
  - severity: noted
    about: artifacts/channels.md
    text: >-
      The speciality-coffee overlap is labelled a hunch, which is honest, but it's
      also the single cheapest thing on this list to check and nobody was tasked
      with checking it.
    settled_by: An afternoon of asking people in one coffee subreddit.

contests:
  Price at £29/mo, not £9: >-
    Reasoned from competitor pricing, not from any willingness-to-pay evidence.
    Defensible, not validated — don't let those blur.

progress:
  percent: 64
  headline: Positioning and price are settled and the page is live. Nobody has said they would buy it.
  whats_missing:
    - No evidence any real person will pay £29 for this
    - The cost model has no supplier quotes behind it
    - Zero waitlist signups. The page only went live this shift

shift_summary: >-
  Maya priced the market properly and was straight about what she couldn't
  establish. Ines committed to £29 and to ceramics-only, both with rejected
  alternatives on the record. Otto's copy is live on a page Kit shipped, and the
  waitlist genuinely stores an email. Nia's money model works on paper and says
  loudly that it's built on guesses. Vera's objection is the one to read: every
  number here is defended against competitors, and not one against a customer.
