name: needs_attention
title: An employee has to ask the founder something
outcome: needs_attention

# The single user-blocking mechanism in the product. It is deliberately expensive
# in fiction ("it costs the company a day") so the roles don't reach for it, and
# deliberately prominent in the UI so a blocked company never looks idle.

company_name: Northwind Ceramics
charter:
  idea: >-
    A monthly subscription box for hand-thrown ceramics. One nice object a month,
    from a named potter, for people who don't want more clutter.
  one_liner: One hand-thrown ceramic object, once a month, from a named potter.
  audience: UK apartment-dwellers aged 28-45 who buy few objects but care what they are.
  success_looks_like: >-
    A live waitlist page with at least 3 real signups and a priced offer the
    founder can defend.
  constraints:
    - UK only for the first year
  tone: Quiet, specific, no exclamation marks.

budget_cap: 60.00
per_shift_cap: 12.00

agenda:
  - Check the £29 price against comparable UK boxes
  - Decide whether we ship internationally
  - Get a landing page live

tick_seconds: 6.0

work:
  - role: researcher
    duration: 190
    cost: 1.21
    tasks_claimed:
      - Validate the £29 price against comparable UK boxes
    activities:
      - is searching for UK ceramics subscription boxes
      - is reading claycollective.uk
      - is comparing what six boxes charge
      - is writing up what she found
    says: >-
      Six boxes, £18-£45, and the ones above £30 all name the maker. Two of them
      ship to the EU and charge nearly double for it.
    artifacts:
      - path: artifacts/market-research.md
        title: UK ceramics subscription boxes — what six competitors charge
        kind: doc
        confidence: sourced
        summary: >-
          Six live UK boxes, £18-£45. Above £30 every one names the maker. Two ship
          to the EU at roughly double the price.
        sources:
          - https://pottery-box.co.uk/pricing
          - https://claycollective.uk/subscribe
        body: |
          # UK ceramics subscription boxes

          | Box | Price / mo | Ships outside UK? | Names the maker? |
          |---|---|---|---|
          | Pottery Box | £18 | No | No |
          | Clay Collective | £29 | EU, +£22 | Yes |
          | Northern Clay | £45 | EU, +£25 | Yes |

          The two that ship to the EU charge close to double, which suggests
          ceramics shipping is genuinely expensive rather than a markup.

          I have no willingness-to-pay evidence for any market. This is what
          sellers ask, not what buyers accept.

  - role: strategist
    duration: 150
    cost: 0.84
    tasks_claimed:
      - Decide whether we ship internationally
    activities:
      - is reading Maya's shipping numbers
      - is working through what international would cost us
      - is stuck on something only the founder can settle
    # This blocks the shift. The company goes BLOCKED and the UI has to make the
    # question impossible to miss — a company waiting on you must never look idle.
    attention:
      question: >-
        The charter says UK only for the first year, but two competitors ship to
        the EU at about double the price and it looks like real demand. Do you
        want me to plan for EU shipping now, or hold the line on UK-only?
      options:
        - Hold the line — UK only, as the charter says
        - Plan for EU shipping at a higher price
        - Ship UK only, but design the page so EU is easy to add later
    says: null

objections: []
contests: {}

progress:
  percent: 28
  headline: The research is in. Ines needs a decision from you before she can go further.
  whats_missing:
    - Waiting on your answer about international shipping
    - The landing page hasn't been started
    - No pricing decision has been committed to yet

shift_summary: >-
  Maya's competitor research is done and includes something the charter didn't
  anticipate: the two boxes that ship to the EU charge nearly double, and it looks
  like real demand rather than a markup. Ines stopped rather than guess, because
  the charter says UK-only and this is your call to change. Answer her and the
  shift picks up from there.
