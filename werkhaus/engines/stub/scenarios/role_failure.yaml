name: role_failure
title: An employee fails and the shift finishes anyway
outcome: completed

# The default scenario in one dev environment, on purpose. If the team only ever
# sees the happy path, the UI only ever learns to render success — and failure is
# the common case, not the exception.

company_name: Northwind Ceramics
charter:
  idea: >-
    A monthly subscription box for hand-thrown ceramics. One nice object a month,
    from a named potter, for people who don't want more clutter.
  one_liner: One hand-thrown ceramic object, once a month, from a named potter.
  audience: UK apartment-dwellers aged 28-45 who buy few objects but care what they are.
  success_looks_like: >-
    A live waitlist page with at least 3 real signups and a priced offer the
    founder can defend.
  constraints:
    - UK only for the first year
    - No paid advertising until the waitlist converts organically
  tone: Quiet, specific, no exclamation marks.

budget_cap: 60.00
per_shift_cap: 12.00

agenda:
  - Settle who this is actually for
  - Get a landing page live with a working waitlist
  - Sketch the money at £29

tick_seconds: 6.0

work:
  - role: strategist
    duration: 160
    cost: 0.88
    tasks_claimed:
      - Settle the audience in one sentence
    activities:
      - is reading what we know about the audience
      - is working out what the wedge is
      - is writing the positioning down
    says: >-
      The wedge is restraint — one object, named maker. I've committed to it and
      named what I rejected.
    decisions:
      - title: Ceramics only — no candles, no "homeware"
        rationale: >-
          The restraint is the product. Every competitor that widened the category
          also stopped naming its makers, and ended up competing on price.
        alternatives_rejected:
          - Add candles and textiles to raise basket value
        reversible: true
    artifacts:
      - path: artifacts/positioning.md
        title: Positioning — one object, one maker, no clutter
        kind: doc
        confidence: inferred
        summary: The wedge is restraint. Reasoned, not tested on any customer.
        sources: []
        body: |
          # Positioning

          **For** people in small UK flats who buy few objects but care what they
          are, **Northwind** sends exactly one hand-thrown piece a month from a
          named potter — **unlike** every other UK box, which sends more things
          and tells you less about who made them.

          ## Confidence

          **Inferred.** This is a reading of the market, not of a customer. The
          claim I'm least sure of is that restraint is *attractive* rather than
          just cheaper to run.

  - role: engineer
    duration: 180
    cost: 1.12
    tasks_claimed:
      - Get a landing page live with a working waitlist
    activities:
      - is setting up the site
      - is building the hero section
      - is trying to get the build working
      - is trying a different approach
    fails: true
    failure_reason: >-
      The site build kept failing on the same step and Kit couldn't get past it
      before running out of attempts.
    says: null

  - role: analyst
    duration: 130
    cost: 0.47
    tasks_claimed:
      - Sketch the unit economics at £29
    activities:
      - is building the one-page money model
      - is labelling which numbers are guesses
    says: >-
      Works at £29 if the potter takes £11 and shipping stays under £5. Every cost
      line is an assumption and I've said so on each one.
    artifacts:
      - path: artifacts/unit-economics.md
        title: Unit economics at £29 — one page
        kind: table
        confidence: assumption
        summary: >-
          About £9.85 contribution per box, if three unverified assumptions hold.
        sources: []
        body: |
          # Unit economics at £29/month

          **Every cost line is an assumption.** No quotes from anyone yet.

          | Line | Per box | Where it came from |
          |---|---|---|
          | Price | £29.00 | Proposed |
          | Potter cost | £11.00 | **Assumption** |
          | Packaging | £2.20 | **Assumption** |
          | UK shipping | £4.80 | **Assumption** |
          | Payments | £1.15 | Stripe public pricing |
          | **Contribution** | **£9.85** | |

          Breakage isn't modelled. For a business that mails ceramics, that's the
          gap most likely to matter.

objections:
  - severity: fatal
    about: artifacts/positioning.md
    text: >-
      We committed to "one object, named maker" without a single piece of
      competitor research this shift. The positioning is asserted, and the one
      artifact that could have grounded it doesn't exist.
    settled_by: Actually looking at what comparable boxes charge and how they sell.
  - severity: serious
    about: artifacts/unit-economics.md
    text: >-
      Breakage is missing from a model for a business whose product is fragile and
      posted. One replacement in twenty removes about 15% of contribution.
    settled_by: A breakage assumption with a stated basis, even a rough one.
  - severity: noted
    text: >-
      The landing page failed to build, so the only claim in this company that
      could have been checked against reality still can't be.
    settled_by: A page that builds and loads.

contests: {}

progress:
  percent: 31
  headline: Positioning and the money model are drafted. The page still isn't up.
  whats_missing:
    - The landing page didn't build — Kit will pick it up next shift
    - No competitor research yet, so the positioning is asserted rather than argued
    - No evidence any real person will pay £29

shift_summary: >-
  Ines settled the positioning and Nia sketched the money, both clearly labelled
  as reasoning rather than evidence. Kit couldn't get the landing page to build
  and stopped after several attempts — the half-built page is saved and he'll
  start there next shift. Vera's fatal objection is worth reading: the company
  committed to a position this shift without doing the research that would
  support it.
